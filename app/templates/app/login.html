{% extends "base.html" %}

{% block content %}
<div class="login-page">
    <h1>Вход</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="form-group">
            {{ form.email.label_tag }}<br>
            {{ form.email }}
            {{ form.email.errors }}
        </div>
        <div class="form-group">
            {{ form.password.label_tag }}<br>
            {{ form.password }}
            {{ form.password.errors }}
        </div>
        <button type="submit" class="price-button">Войти</button>
    </form>
</div>
{% endblock %}
